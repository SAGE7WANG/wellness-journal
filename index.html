    }
    if (e.target.closest('#addSel')){
      if (!ui.foodSel){ toast('请先选择一种食物'); return; }
      const g = ui.foodGram > 0 ? ui.foodGram : 100;
      ui.cart.push({
        name: ui.foodSel.name + ' ' + g + 'g',
        kcal: Math.round(ui.foodSel.kcal * g / 100),
        gram: g, cat: ui.foodSel.cat
      });
      renderCart();
      toast('已加入清单');
    }
  });
  $('#cartConfirm').onclick = () => {
    if (!ui.cart.length){ toast('清单还是空的'); return; }
    const d = ensureDay(viewDate);
    ui.cart.forEach(c => {
      d.meals.push({ id: uid(), type: mealType, name: c.name, kcal: c.kcal, t: nowHM() });
    });
    save(); closeModal(); refresh();
    toast('已添加 ' + ui.cart.length + ' 项食物');
  };
  setTimeout(() => { const q = $('#foodQuery'); if (q) q.focus(); }, 80);
}
function renderFoodList(){
  const q = ui.foodQuery.toLowerCase();
  const list = FOODS.filter(f =>
    (ui.foodCat === '全部' || f.cat === ui.foodCat) &&
    (!q || f.name.toLowerCase().indexOf(q) >= 0 || f.cat.indexOf(q) >= 0));
  const host = $('#foodList');
  if (!host) return;
  host.innerHTML = list.length ? list.map(f => {
    const idx = FOODS.indexOf(f);
    const on = ui.foodSel && ui.foodSel.name === f.name;
    return '<div class="food-item' + (on ? ' on' : '') + '" data-food="' + idx + '">' +
      '<span class="nm">' + esc(f.name) + '<small>' + f.cat + '</small></span>' +
      '<span class="kc">' + f.kcal + ' kcal</span></div>';
  }).join('') : '<div class="empty">没有找到匹配的食物，可在下方手动添加</div>';
}
function renderFoodDetail(){
  const host = $('#foodDetail');
  if (!host) return;
  const sel = ui.foodSel;
  if (!sel){
    host.innerHTML = renderCustomForm();
    return;
  }
  host.innerHTML =
    '<div class="portion-row">' +
      '<span class="field-lbl">份量</span>' +
      [50,100,150,200,250,300].map(g => '<button class="qbtn" data-gram="' + g + '"' +
        (ui.foodGram === g ? ' style="border-color:var(--jade-line);color:var(--jade-2)"' : '') + '>' + g + 'g</button>').join('') +
      '<div class="input-box" style="width:110px;padding:6px 12px"><input type="number" id="foodGram" value="' + ui.foodGram + '" min="1" max="2000" inputmode="numeric"><span class="sfx">g</span></div>' +
      '<span class="portion-actions">' +
        '<span class="metric-sub">≈ <b class="num" id="foodKcal" style="font-size:16px;color:var(--gold)">' +
          Math.round(sel.kcal * ui.foodGram / 100) + '</b> kcal</span>' +
        '<button class="primary-btn" id="addSel" style="padding:9px 18px">加入清单</button>' +
      '</span>' +
    '</div>' + renderCustomForm();
}
function updateFoodKcal(){
  const el = $('#foodKcal');
  if (el && ui.foodSel) el.textContent = Math.round(ui.foodSel.kcal * ui.foodGram / 100);
  $$('#foodDetail [data-gram]').forEach(b => {
    const on = num(b.dataset.gram) === ui.foodGram;
    b.style.borderColor = on ? 'var(--jade-line)' : '';
    b.style.color = on ? 'var(--jade-2)' : '';
  });
}
function renderCustomForm(){
  return '<div class="portion-row" style="margin-top:10px;padding-top:14px;border-top:1px dashed var(--line)">' +
    '<span class="field-lbl">自定义</span>' +
    '<div class="input-box" style="flex:1;min-width:130px;padding:6px 12px"><input type="text" id="customName" placeholder="食物名称"></div>' +
    '<div class="input-box" style="width:130px;padding:6px 12px"><input type="number" id="customKcal" placeholder="热量" min="0" inputmode="numeric"><span class="sfx">kcal</span></div>' +
    '<button class="ghost-btn" id="addCustom">加入清单</button></div>';
}
function renderCart(){
  const host = $('#foodCart');
  if (!host) return;
  const total = ui.cart.reduce((s, c) => s + num(c.kcal), 0);
  $('#cartKcal').textContent = total;
  host.innerHTML = ui.cart.length
    ? '<div class="sub-head" style="margin-bottom:8px">本次清单</div>' + ui.cart.map((c, i) =>
        '<div class="cart-row"><span>' + esc(c.name) + '</span>' +
        '<span class="kc">' + num(c.kcal) + ' kcal</span>' +
        '<button class="log-del" data-delcart="' + i + '" aria-label="移除">×</button></div>').join('')
    : '';
  host.onclick = e => {
    const b = e.target.closest('[data-delcart]');
    if (!b) return;
    ui.cart.splice(num(b.dataset.delcart), 1);
    renderCart();
  };
}

/* ============================================================
   11. 图表浮层提示
   ============================================================ */
const tipEl = $('#chartTip');
document.addEventListener('mouseover', e => {
  const t = e.target.closest('[data-tip]');
  if (!t || !t.dataset.tip) return;
  tipEl.textContent = t.dataset.tip;
  tipEl.classList.add('show');
  const r = t.getBoundingClientRect();
  tipEl.style.left = (r.left + r.width / 2) + 'px';
  tipEl.style.top = (r.top - 8) + 'px';
});
document.addEventListener('mouseout', e => {
  if (e.target.closest('[data-tip]')) tipEl.classList.remove('show');
});
window.addEventListener('scroll', () => tipEl.classList.remove('show'), { passive:true });

/* ============================================================
   12. 刷新与启动
   ============================================================ */
function refresh(){
  renderDateBar();
  renderScoreRing();
  renderHero();
  renderPanel();
  renderStats();
}
/* 轻量刷新：不重建当前面板，输入过程中不会丢失焦点 */
function softRefresh(){
  renderDateBar();
  renderScoreRing();
  renderHero();
  renderStats();
  const meta = $('#panel .panel-meta');
  if (meta) meta.innerHTML = panelMeta();
  const viz = $('#panel .sleep-viz');
  if (viz) viz.innerHTML = sleepVizHTML(getDay(viewDate));
  const wviz = $('#panel .work-viz');
  if (wviz) wviz.innerHTML = overtimeVizHTML(getDay(viewDate));
  const wd = $('#panel #weightDelta');
  if (wd) wd.innerHTML = weightDeltaHTML();
  const bmr = $('#panel #bmrVal');
  if (bmr) bmr.textContent = bmrFor(viewDate);
}
window.addEventListener('resize', () => { moveTabInk(); });

(function init(){
  if (memoryOnly) showBanner('当前浏览器不可用本地存储（可能处于隐私模式），数据仅在本次会话中有效。建议改用普通窗口打开，并及时导出备份。');
  $('#dateJump').max = todayKey();
  setTab('water');
  refresh();
  // 首次使用提示
  const hasData = Object.keys(state.days).length > 0;
  if (!hasData) setTimeout(() => toast('欢迎使用起居注 · 从记录第一杯水开始吧'), 700);
})();

})();
</script>
